<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrashTagger — Report a Black Spot</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#171b19;
    --card:#20251f;
    --card-2:#262c25;
    --wet:#4e7d5c;
    --hazard:#c1512f;
    --amber:#c99a3e;
    --paper:#ece7d9;
    --paper-dim:#a9a89c;
    --line:#3a4038;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}

  .masthead{
    border-bottom:3px solid var(--paper); padding-bottom:12px; margin-bottom:20px;
  }
  .masthead h1{
    font-family:'Archivo Black',sans-serif; font-size:24px; margin:0; text-transform:uppercase;
  }
  .masthead .meta{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--paper-dim); margin-top:4px;
  }

  #map{
    width:100%; height:380px; border:1px solid var(--line); border-radius:4px; margin-bottom:24px;
  }

  .panel-title{
    font-family:'Oswald',sans-serif; font-size:16px; letter-spacing:1.5px;
    text-transform:uppercase; margin-bottom:14px; border-left:3px solid var(--wet); padding-left:8px;
  }

  .form-card{
    background:var(--card); border:1px solid var(--line); border-radius:4px; padding:16px;
  }

  .field-group{margin-bottom:14px;}
  .field-group label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:11px;
    text-transform:uppercase; color:var(--paper-dim); margin-bottom:6px; letter-spacing:0.5px;
  }

  .coords-text{
    font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--amber); padding:8px 0;
  }

  select, textarea{
    width:100%; background:var(--ink); border:1px solid var(--line); color:var(--paper);
    padding:8px 10px; font-family:'IBM Plex Mono',monospace; font-size:12px; border-radius:2px;
  }
  textarea{ font-family:'Inter',sans-serif; font-size:13px; resize:vertical; min-height:70px; }

  .submit-btn{
    width:100%; padding:12px 0; background:var(--wet); color:#0a1a0e; border:none;
    border-radius:2px; font-family:'Oswald',sans-serif; font-weight:600;
    font-size:14px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; margin-top:10px;
  }
  .submit-btn:disabled{opacity:0.5; cursor:not-allowed;}
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <h1>TrashTagger</h1>
    <div class="meta">CITIZEN REPORTING PORTAL • BBMP SANITATION</div>
  </div>

  <div id="map"></div>

  <div class="form-card">
    <div class="panel-title">Submit Black Spot Report</div>
    <form id="reportForm">
      
      <div class="field-group">
        <label>1. Location Coordinates</label>
        <div class="coords-text" id="coordsText">Click anywhere on the map to pin location...</div>
      </div>

      <div class="field-group">
        <label>2. Severity Level</label>
        <select id="severityInput" required>
          <option value="" disabled selected>-- Select Severity --</option>
          <option value="LOW">LOW</option>
          <option value="MEDIUM">MEDIUM</option>
          <option value="HIGH">HIGH</option>
        </select>
      </div>

      <div class="field-group">
        <label>3. Additional Notes (Optional)</label>
        <textarea id="noteInput" placeholder="Add details..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn" disabled>Log Report</button>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCQiMeEqEny83vT8tFDTyHIIhw-6GSWxa0",
  authDomain: "blackspot-ledger.firebaseapp.com",
  projectId: "blackspot-ledger",
  storageBucket: "blackspot-ledger.firebasestorage.app",
  messagingSenderId: "858874785569",
  appId: "1:858874785569:web:3b73d8981bc22bc0c1d860"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const map = L.map('map').setView([12.9716, 77.5946], 13);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri',
  maxZoom: 18
}).addTo(map);

let currentMarker = null;
let selectedLat = null;
let selectedLng = null;

const submitBtn = document.getElementById('submitBtn');
const coordsText = document.getElementById('coordsText');

map.on('click', (e) => {
  selectedLat = e.latlng.lat;
  selectedLng = e.latlng.lng;
  if (currentMarker) map.removeLayer(currentMarker);
  currentMarker = L.marker([selectedLat, selectedLng]).addTo(map);
  coordsText.textContent = `📍 ${selectedLat.toFixed(5)}, ${selectedLng.toFixed(5)}`;
  submitBtn.disabled = false;
});

document.getElementById('reportForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!selectedLat || !selectedLng) return;

  submitBtn.disabled = true;
  submitBtn.textContent = "Logging...";

  try {
    await addDoc(collection(db, "reports"), {
      lat: selectedLat,
      lng: selectedLng,
      sev: document.getElementById('severityInput').value,
      note: document.getElementById('noteInput').value.trim(),
      status: 'active',
      ts: Date.now()
    });

    alert("Report logged successfully!");
    document.getElementById('reportForm').reset();
    if (currentMarker) map.removeLayer(currentMarker);
    coordsText.textContent = "Click anywhere on the map to pin location...";
    submitBtn.textContent = "Log Report";
  } catch (err) {
    console.error("Error logging report:", err);
    alert("Failed to submit report.");
    submitBtn.disabled = false;
    submitBtn.textContent = "Log Report";
  }
});
</script>
</body>
</html>
