<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrashTagger — Report Black Spots</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#171b19;
    --card:#20251f;
    --card-2:#262c25;
    --wet:#4e7d5c;
    --dry:#4a7a93;
    --hazard:#c1512f;
    --amber:#c99a3e;
    --paper:#ece7d9;
    --paper-dim:#a9a89c;
    --line:#3a4038;
    --bbmp-blue:#2d72d9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px;}

  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:3px solid var(--paper); padding-bottom:10px; margin-bottom:16px;
    flex-wrap:wrap; gap:8px;
  }
  .masthead h1{
    font-family:'Archivo Black',sans-serif; font-size:clamp(22px,5vw,32px);
    letter-spacing:0.5px; margin:0; text-transform:uppercase;
  }
  .masthead h1 span{color:var(--bbmp-blue);}
  .masthead .meta{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--paper-dim);
    text-align:right; line-height:1.5;
  }

  .grid{display:grid; grid-template-columns:1fr 340px; gap:18px;}
  @media(max-width:850px){.grid{grid-template-columns:1fr;}}

  #map{width:100%; height:450px; border:1px solid var(--line); border-radius:3px;}

  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:3px; padding:18px;
  }
  .panel-title{
    font-family:'Oswald',sans-serif; font-size:14px; letter-spacing:2px;
    text-transform:uppercase; color:var(--paper); margin:0 0 14px;
    border-left:3px solid var(--bbmp-blue); padding-left:8px;
  }

  label{display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; color:var(--paper-dim); margin:12px 0 4px;}
  input, textarea, select{
    width:100%; background:var(--ink); border:1px solid var(--line); color:var(--paper);
    padding:10px; font-family:'IBM Plex Mono',monospace; font-size:12px; border-radius:2px; outline:none;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--bbmp-blue);}
  textarea{min-height:70px; resize:vertical; font-family:'Inter',sans-serif;}

  .btn{
    width:100%; margin-top:16px; padding:12px; background:var(--bbmp-blue); color:#fff;
    border:none; border-radius:2px; font-family:'Oswald',sans-serif; font-size:14px;
    font-weight:600; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:background 0.2s;
  }
  .btn:hover{background:#3b82ed;}
  .btn-gps{
    background:var(--card-2); border:1px solid var(--line); color:var(--paper);
    padding:8px; font-size:11px; margin-top:6px; cursor:pointer; width:100%;
    font-family:'IBM Plex Mono',monospace; text-transform:uppercase;
  }

  .status-msg{
    font-family:'IBM Plex Mono',monospace; font-size:11px; margin-top:10px;
    padding:8px; border-radius:2px; display:none; text-align:center;
  }
  .status-msg.success{background:rgba(37,211,102,0.2); color:#25D366; border:1px solid #25D366;}
  .status-msg.error{background:rgba(193,81,47,0.2); color:var(--hazard); border:1px solid var(--hazard);}
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <h1>Trash<span>Tagger</span></h1>
    <div class="meta">CIVIC BLACK SPOT REPORTING<br>BANGALORE SANITATION LEDGER</div>
  </div>

  <div class="grid">
    <div>
      <div id="map"></div>
      <p style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--paper-dim); margin-top:8px;">
        * Click anywhere on the map to set the exact spot location.
      </p>
    </div>

    <div class="panel">
      <div class="panel-title">Report New Dump</div>
      <form id="reportForm">
        <label>Selected Coordinates</label>
        <input type="text" id="coordsInput" placeholder="Click map or use GPS" readonly required>
        <button type="button" class="btn-gps" id="gpsBtn">📍 Use Current GPS Location</button>

        <label>Dump Severity</label>
        <select id="sevInput">
          <option value="1">Severity 1 — Minor / Organic Litter</option>
          <option value="2" selected>Severity 2 — Moderate Overflow</option>
          <option value="3">Severity 3 — Major Hazard / Uncollected Waste</option>
        </select>

        <label>Description / Landmark</label>
        <textarea id="noteInput" placeholder="e.g. Near corner of 4th Main Road, blocking sidewalk"></textarea>

        <button type="submit" class="btn">Log Blackspot Report</button>
        <div class="status-msg" id="statusMsg"></div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyCQiMeEqEny83vT8tFDTyHIIhw-6GSWxa0",
  authDomain: "blackspot-ledger.firebaseapp.com",
  projectId: "blackspot-ledger",
  storageBucket: "blackspot-ledger.firebasestorage.app",
  messagingSenderId: "858874785569",
  appId: "1:858874785569:web:3b73d8981bc22bc0c1d860",
  measurementId: "G-MQ0WBXET6E"
};

let reports = JSON.parse(localStorage.getItem('bs_reports_cache') || '[]');
let db = null, collection, addDoc, onSnapshot;
let selectedLat = null, selectedLng = null, activeMarker = null;

let map, markersGroup;

function initMap(){
  const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri Satellite', maxZoom: 18
  });
  const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 });

  map = L.map('map', { layers: [satelliteLayer] }).setView([12.9716, 77.5946], 13);
  L.control.layers({ "Satellite": satelliteLayer, "Dark Mode": darkLayer }).addTo(map);
  markersGroup = L.layerGroup().addTo(map);

  map.on('click', (e) => {
    setPin(e.latlng.lat, e.latlng.lng);
  });
}

function setPin(lat, lng){
  selectedLat = lat;
  selectedLng = lng;
  document.getElementById('coordsInput').value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;

  if(activeMarker) map.removeLayer(activeMarker);
  activeMarker = L.marker([lat, lng]).addTo(map).bindPopup("Selected Spot").openPopup();
}

document.getElementById('gpsBtn').addEventListener('click', ()=>{
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude, longitude } = pos.coords;
      map.setView([latitude, longitude], 16);
      setPin(latitude, longitude);
    }, () => alert("Could not fetch GPS location. Please select manually on map."));
  }
});

async function initFirebase(){
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js");
    const fs = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");
    collection = fs.collection; addDoc = fs.addDoc; onSnapshot = fs.onSnapshot;
    const app = initializeApp(firebaseConfig);
    db = fs.getFirestore(app);
    onSnapshot(collection(db, "reports"), (snapshot) => {
      reports = snapshot.docs.map(d => ({ docId: d.id, ...d.data() }));
      localStorage.setItem('bs_reports_cache', JSON.stringify(reports));
      renderMarkers();
    });
  } catch(e) {
    renderMarkers();
  }
}

function renderMarkers(){
  if(!map) return;
  markersGroup.clearLayers();
  reports.forEach(r => {
    const color = r.status === 'resolved' ? '#25D366' : (r.sev === 3 ? '#c1512f' : r.sev === 2 ? '#c99a3e' : '#4e7d5c');
    L.circleMarker([r.lat, r.lng], {
      radius: 7, color: color, fillColor: color, fillOpacity: 0.7, weight: 2
    }).bindPopup(`<b>${r.status === 'resolved' ? 'RESOLVED' : 'ACTIVE DUMP'}</b><br>Note: ${r.note || 'None'}`).addTo(markersGroup);
  });
}

document.getElementById('reportForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('statusMsg');
  if(!selectedLat || !selectedLng){
    msg.className = "status-msg error";
    msg.textContent = "Please click on the map to set a location first!";
    msg.style.display = "block";
    return;
  }

  const newReport = {
    lat: selectedLat,
    lng: selectedLng,
    sev: parseInt(document.getElementById('sevInput').value, 10),
    note: document.getElementById('noteInput').value.trim(),
    status: 'active',
    ts: Date.now()
  };

  try {
    if(db){
      await addDoc(collection(db, "reports"), newReport);
    } else {
      reports.push(newReport);
      localStorage.setItem('bs_reports_cache', JSON.stringify(reports));
      renderMarkers();
    }
    msg.className = "status-msg success";
    msg.textContent = "Report logged successfully!";
    msg.style.display = "block";
    document.getElementById('reportForm').reset();
    if(activeMarker) map.removeLayer(activeMarker);
    selectedLat = null; selectedLng = null;
  } catch(err) {
    msg.className = "status-msg error";
    msg.textContent = "Failed to submit report. Saved locally.";
    msg.style.display = "block";
  }
});

window.onload = () => {
  initMap();
  initFirebase();
};
</script>
</body>
</html>
