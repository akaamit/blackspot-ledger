<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrashTagger Authority Portal — BBMP Sanitation</title>

<!-- Leaflet Satellite Map CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#171b19;
    --card:#20251f;
    --card-2:#262c25;
    --wet:#4e7d5c;
    --dry:#4a7a93;
    --hazard:#c1512f;
    --amber:#c99a3e;
    --paper:#ece7d9;
    --paper-dim:#a9a89c;
    --line:#3a4038;
    --resolved:#5a6558;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}

  .masthead{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:3px solid var(--paper); padding-bottom:12px; margin-bottom:20px;
    flex-wrap:wrap; gap:12px;
  }
  .masthead h1{
    font-family:'Archivo Black',sans-serif; font-size:24px;
    margin:0; text-transform:uppercase; display:flex; align-items:center; gap:10px;
  }
  .masthead h1 span.badge{
    background:var(--hazard); color:#fff; font-size:11px; font-family:'IBM Plex Mono',monospace;
    padding:3px 8px; border-radius:2px; letter-spacing:1px;
  }
  .masthead .meta{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--paper-dim);
  }

  /* Embedded Satellite Map */
  #map{
    width:100%; height:380px; border:1px solid var(--line); border-radius:4px;
    margin-bottom:24px;
  }

  .panel-title{
    font-family:'Oswald',sans-serif; font-size:16px; letter-spacing:1.5px;
    text-transform:uppercase; margin-bottom:14px; border-left:3px solid var(--wet); padding-left:8px;
    display:flex; justify-content:space-between; align-items:center;
  }

  .report-list{display:flex; flex-direction:column; gap:14px;}
  .report-card{
    background:var(--card); border:1px solid var(--line); border-radius:4px; padding:16px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;
  }
  .report-info{flex:1; min-width:280px;}

  /* Clickable Map Coordinates Link */
  .report-coords-link{
    font-family:'Oswald',sans-serif; font-size:18px; color:var(--amber);
    letter-spacing:0.5px; text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    transition:color 0.2s;
  }
  .report-coords-link:hover{
    color:var(--paper); text-decoration:underline;
  }
  .report-coords-link .ext-tag{
    font-family:'IBM Plex Mono',monospace; font-size:10px; background:var(--card-2);
    border:1px solid var(--line); color:var(--paper-dim); padding:2px 6px; border-radius:2px;
  }

  .report-meta{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--paper-dim); margin-top:6px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }

  /* Severity Badge Styles */
  .sev-badge{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    padding:2px 8px; border-radius:3px; letter-spacing:0.5px; display:inline-block;
  }
  .sev-low{
    background:#1b382b; color:#52b788; border:1px solid #2d6a4f;
  }
  .sev-medium{
    background:#3d3210; color:#f3c053; border:1px solid #7a631c;
  }
  .sev-high{
    background:#4a1c1c; color:#ff6b6b; border:1px solid #9e2a2b;
  }

  .report-note{
    background:var(--ink); border:1px solid var(--line); border-radius:3px; padding:8px 10px;
    font-size:12.5px; margin-top:8px; color:var(--paper);
  }

  .resolve-btn{
    background:var(--wet); color:#0a1a0e; border:none; border-radius:3px;
    padding:10px 18px; font-family:'Oswald',sans-serif; font-weight:600;
    font-size:13px; letter-spacing:1px; text-transform:uppercase; cursor:pointer;
  }
  .resolve-btn:hover{background:#5c9270;}

  /* Resolution Modal */
  .modal-overlay{
    display:none; position:fixed; top:0; left:0; width:100vw; height:100vh;
    background:rgba(10,13,11,0.92); z-index:9999; justify-content:center; align-items:center; padding:20px;
  }
  .modal-box{
    background:var(--card); border:1px solid var(--line); border-radius:4px;
    padding:22px; max-width:500px; width:100%; position:relative; max-height:90vh; overflow-y:auto;
  }
  .modal-close{
    position:absolute; top:12px; right:14px; background:none; border:none;
    color:var(--paper-dim); font-size:20px; cursor:pointer;
  }
  .modal-close:hover{color:var(--paper);}
  .modal-heading{
    font-family:'Oswald',sans-serif; font-size:18px; text-transform:uppercase;
    margin:0 0 16px; letter-spacing:1px; color:var(--paper);
  }

  .file-group{margin-bottom:16px;}
  .file-group label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:11px;
    text-transform:uppercase; color:var(--amber); margin-bottom:6px; letter-spacing:0.5px;
  }
  .file-group input[type="file"], .file-group textarea{
    width:100%; background:var(--ink); border:1px solid var(--line); color:var(--paper);
    padding:8px; font-family:'IBM Plex Mono',monospace; font-size:11px; border-radius:2px;
  }
  .file-group textarea{
    font-family:'Inter',sans-serif; font-size:12px; resize:vertical; min-height:65px;
  }
  .file-group textarea:focus{
    outline:1px solid var(--wet);
  }
  .preview-thumb{
    max-width:100%; height:120px; object-fit:cover; border:1px solid var(--line);
    margin-top:6px; display:none; border-radius:2px;
  }

  .submit-resolve-btn{
    width:100%; padding:12px 0; background:var(--wet); color:#0a1a0e; border:none;
    border-radius:2px; font-family:'Oswald',sans-serif; font-weight:600;
    font-size:14px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; margin-top:10px;
  }
  .submit-resolve-btn:disabled{opacity:0.5; cursor:not-allowed;}

  .empty-state{
    font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--paper-dim);
    text-align:center; padding:40px 0; border:1px dashed var(--line); border-radius:4px;
  }

  .leaflet-popup-content-wrapper{background:var(--card); color:var(--paper); border-radius:3px;}
  .leaflet-popup-tip{background:var(--card);}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>TrashTagger <span class="badge">AUTHORITY PORTAL</span></h1>
      <div class="meta">BBMP SANITATION ACTION & DISPATCH CONTROL</div>
    </div>
  </div>

  <!-- Interactive Satellite Overview Map -->
  <div id="map"></div>

  <div class="panel-title">
    <span>Active Black Spots Requiring Action</span>
    <span id="activeCountBadge" style="font-family:'IBM Plex Mono'; font-size:12px; color:var(--paper-dim);">0 Pending</span>
  </div>

  <div class="report-list" id="reportList">
    <div class="empty-state">Loading active spots…</div>
  </div>

</div>

<!-- Resolve Action Modal (Before & After Image Uploads + Action Comments) -->
<div class="modal-overlay" id="resolveModal">
  <div class="modal-box">
    <button class="modal-close" id="closeModal">✕</button>
    <div class="modal-heading">Attach Cleanup Proof & Resolve</div>
    <form id="resolveForm">
      
      <!-- Upload 1: Before Image -->
      <div class="file-group">
        <label>1. Before Cleanup Photo (Initial Spot)</label>
        <input type="file" id="beforeImgInput" accept="image/*" required>
        <img id="beforePreview" class="preview-thumb" alt="Before Preview">
      </div>

      <!-- Upload 2: After Image -->
      <div class="file-group">
        <label>2. After Cleanup Photo (Cleared Spot)</label>
        <input type="file" id="afterImgInput" accept="image/*" required>
        <img id="afterPreview" class="preview-thumb" alt="After Preview">
      </div>

      <!-- Field 3: Resolution Comments -->
      <div class="file-group">
        <label>3. Action Comments / Resolution Notes (Optional)</label>
        <textarea id="resolveCommentInput" placeholder="e.g., Cleared 40kg dry waste, assigned sanitation vehicle auto #04..."></textarea>
      </div>

      <button type="submit" class="submit-resolve-btn" id="saveResolveBtn">Confirm Cleanup & Mark Resolved</button>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCQiMeEqEny83vT8tFDTyHIIhw-6GSWxa0",
  authDomain: "blackspot-ledger.firebaseapp.com",
  projectId: "blackspot-ledger",
  storageBucket: "blackspot-ledger.firebasestorage.app",
  messagingSenderId: "858874785569",
  appId: "1:858874785569:web:3b73d8981bc22bc0c1d860"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Helper function to categorize severity into LOW (Green), MEDIUM (Yellow), HIGH (Red)
function getSevDetails(sev) {
  const s = String(sev).toLowerCase();
  if (s === '1' || s === 'low') {
    return { label: 'LOW', color: '#52b788', cssClass: 'sev-low' };
  } else if (s === '2' || s === 'medium') {
    return { label: 'MEDIUM', color: '#f3c053', cssClass: 'sev-medium' };
  } else {
    return { label: 'HIGH', color: '#ff6b6b', cssClass: 'sev-high' };
  }
}

// Leaflet Satellite Map Setup
const map = L.map('map').setView([12.9716, 77.5946], 13);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; Source: Esri',
  maxZoom: 18
}).addTo(map);

const markersLayer = L.layerGroup().addTo(map);

let activeDocId = null;
let beforeBase64 = null;
let afterBase64 = null;

const resolveModal = document.getElementById('resolveModal');
const beforeImgInput = document.getElementById('beforeImgInput');
const afterImgInput = document.getElementById('afterImgInput');
const beforePreview = document.getElementById('beforePreview');
const afterPreview = document.getElementById('afterPreview');
const resolveCommentInput = document.getElementById('resolveCommentInput');

document.getElementById('closeModal').addEventListener('click', () => {
  resolveModal.style.display = 'none';
});

// Convert uploaded file to Base64
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 800;
        let scale = 1;
        if (img.width > MAX_WIDTH) scale = MAX_WIDTH / img.width;
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

beforeImgInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (file) {
    beforeBase64 = await fileToBase64(file);
    beforePreview.src = beforeBase64;
    beforePreview.style.display = 'block';
  }
});

afterImgInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (file) {
    afterBase64 = await fileToBase64(file);
    afterPreview.src = afterBase64;
    afterPreview.style.display = 'block';
  }
});

window.openResolveModal = function(docId) {
  activeDocId = docId;
  beforeBase64 = null;
  afterBase64 = null;
  beforeImgInput.value = '';
  afterImgInput.value = '';
  resolveCommentInput.value = '';
  beforePreview.style.display = 'none';
  afterPreview.style.display = 'none';
  resolveModal.style.display = 'flex';
};

document.getElementById('resolveForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!activeDocId || !beforeBase64 || !afterBase64) {
    alert("Please upload both Before and After cleanup photos.");
    return;
  }

  const saveBtn = document.getElementById('saveResolveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = "Updating Record...";

  try {
    const reportRef = doc(db, "reports", activeDocId);
    await updateDoc(reportRef, {
      status: 'resolved',
      beforeImage: beforeBase64,
      afterImage: afterBase64,
      proofImage: afterBase64,
      resolutionComment: resolveCommentInput.value.trim(),
      resolvedAt: Date.now()
    });

    resolveModal.style.display = 'none';
    alert("Spot successfully resolved!");
  } catch (err) {
    console.error("Error resolving report:", err);
    alert("Failed to update status. Please try again.");
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "Confirm Cleanup & Mark Resolved";
  }
});

// Real-time listener for active reports
onSnapshot(collection(db, "reports"), (snapshot) => {
  const reports = snapshot.docs
    .map(d => ({ docId: d.id, ...d.data() }))
    .filter(r => r.status !== 'resolved');

  document.getElementById('activeCountBadge').textContent = `${reports.length} Active`;

  markersLayer.clearLayers();
  const reportList = document.getElementById('reportList');

  if (reports.length === 0) {
    reportList.innerHTML = `<div class="empty-state">🎉 All reported black spots are currently cleared!</div>`;
    return;
  }

  const bounds = [];

  reportList.innerHTML = reports.map(r => {
    bounds.push([r.lat, r.lng]);
    const sev = getSevDetails(r.sev);

    // Add marker to Satellite map with dynamic severity color
    const marker = L.circleMarker([r.lat, r.lng], {
      radius: 9,
      color: sev.color,
      fillColor: sev.color,
      fillOpacity: 0.85,
      weight: 2
    }).bindPopup(`
      <b style="font-family:'Oswald'; color:${sev.color};">SEVERITY: ${sev.label}</b><br>
      ${r.note ? r.note : 'No notes'}<br><br>
      <a href="https://www.google.com/maps?q=${r.lat},${r.lng}&t=k" target="_blank" style="color:#c99a3e; text-decoration:none;">Open Satellite View ↗</a>
    `);
    markersLayer.addLayer(marker);

    // Clickable Google Maps Satellite URL
    const gmapsSatelliteUrl = `https://www.google.com/maps?q=${r.lat},${r.lng}&t=k`;

    return `
      <div class="report-card">
        <div class="report-info">
          <a href="${gmapsSatelliteUrl}" target="_blank" class="report-coords-link" title="Open in Google Maps Satellite View">
            📍 ${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}
            <span class="ext-tag">Open Satellite Map ↗</span>
          </a>
          <div class="report-meta">
            <span>SEVERITY:</span>
            <span class="sev-badge ${sev.cssClass}">${sev.label}</span>
            <span>· LOGGED: ${new Date(r.ts).toLocaleString('en-IN')}</span>
          </div>
          ${r.note ? `<div class="report-note">Note: "${r.note}"</div>` : ''}
        </div>
        <button class="resolve-btn" onclick="openResolveModal('${r.docId}')">Resolve Spot</button>
      </div>
    `;
  }).join('');

  if (bounds.length > 0) {
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
  }
});
</script>
</body>
</html>
